---
- name: Deploy Docker, Docker Compose, and Nginx via Compose
  hosts: webservers
  become: true

  tasks:
    - name: Update apt cache and install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create app directory on target servers
      file:
        path: /opt/nginx_app
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to target servers
      copy:
        src: docker-compose.yml
        dest: /opt/nginx_app/docker-compose.yml
        mode: '0644'

    - name: Pull Nginx image explicitly
      community.docker.docker_image:
        name: nginx
        tag: latest
        source: pull

    - name: Deploy Nginx container via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/nginx_app
        state: present
