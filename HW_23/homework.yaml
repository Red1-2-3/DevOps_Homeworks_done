apiVersion: v1
kind: Pod
metadata:
  name: homework-nginx
  labels:
    app: web-nginx
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-service
spec:
  type: NodePort
  selector:
    app: web-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32080
